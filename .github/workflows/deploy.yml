# 배포: main에 push → 검사(ci.yml) → 이미지 올리기(GHCR, 태그 = 커밋 해시) → 서버에서 받아 띄우기 → 상태 확인 → 관리 서버에 배포 기록.
# 검사가 실패하면 뒤 단계는 돌지 않는다 (배포 차단). 서버에서 새 버전이 뜨지 않으면 직전 버전으로 되돌린다 (deploy/remote_deploy.sh).
# 결과는 Actions 실행 결과와 관리 서버의 배포 기록으로 본다. Discord 알림은 두지 않는다 (2026-10-08 사용자 결정, docs/DECISIONS.md 24장).
#
# 서버를 준비하기 전에는 검사만 돈다. 준비가 끝나면 저장소 변수 DEPLOY_ENABLED를 true로 바꾼다. 설정 방법은 docs/DEPLOY.md.
#   변수(Settings → Secrets and variables → Actions → Variables): DEPLOY_ENABLED, DEPLOY_HOST, DEPLOY_USER, DEPLOY_DIR,
#     DEPLOY_HOST_KEY, DEPLOY_PORT(선택, 기본 22)
#   비밀 값(Secrets): DEPLOY_SSH_KEY
# admin/만 바뀐 push는 이 배포를 돌리지 않는다 (관리 서버는 admin-deploy.yml).
# 관리 서버에 배포 기록 남기기(선택, admin/README.md 7-3): 변수 ADMIN_RECORD_HOST, ADMIN_RECORD_HOST_KEY, ADMIN_RECORD_USER(기본 ubuntu),
#   DEPLOY_SERVER_NAME(기본 app) · 비밀 값 ADMIN_RECORD_SSH_KEY (관리 서버에서 기록 한 줄만 쓸 수 있는 강제 명령 키)
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "admin/**"
      - ".github/workflows/admin-*.yml"
  workflow_dispatch:   # 같은 커밋을 다시 배포할 때 (Actions 화면에서 실행)

permissions:
  contents: read

jobs:
  ci:
    name: 검사
    uses: ./.github/workflows/ci.yml

  publish:
    name: 이미지 올리기 (GHCR)
    needs: ci
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.names.outputs.image_prefix }}
      image_tag: ${{ steps.names.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: 이미지 이름 정하기
        id: names
        run: |
          # 레지스트리 경로는 소문자여야 한다
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paper-trading" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ci.yml의 컨테이너 작업이 만든 캐시를 그대로 받아 올린다 (같은 커밋이라 다시 만드는 층이 없다)
      - name: 올리기 (web)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: true
          tags: ${{ steps.names.outputs.image_prefix }}-web:${{ steps.names.outputs.image_tag }}
          cache-from: type=gha,scope=web

      - name: 올리기 (engine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: engine
          push: true
          tags: ${{ steps.names.outputs.image_prefix }}-engine:${{ steps.names.outputs.image_tag }}
          cache-from: |
            type=gha,scope=engine
            type=gha,scope=web

      - name: 올리기 (nginx + 프론트엔드)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/nginx/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.image_prefix }}-nginx:${{ steps.names.outputs.image_tag }}
          cache-from: type=gha,scope=nginx

  deploy:
    name: 서버 배포
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:   # 배포는 한 번에 하나만. 도는 중인 배포를 끊지 않는다
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    outputs:   # 서버 스크립트가 남긴 결과 (관리 서버 배포 기록용)
      result: ${{ steps.up.outputs.result }}
      previous: ${{ steps.up.outputs.previous }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
      IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
      IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_DIR DEPLOY_HOST_KEY DEPLOY_SSH_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::설정이 비어 있습니다:$missing (docs/DEPLOY.md)"; exit 1; }
          case "$DEPLOY_DIR" in
            *[!A-Za-z0-9_./-]*|-*) echo "::error::DEPLOY_DIR에는 영문·숫자·_ . / - 만 쓴다 (~ 대신 /home/... 전체 경로)"; exit 1 ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 서버의 호스트 키는 저장소 변수에 적어 둔 것만 믿는다 (접속하면서 받아 오지 않는다).
          # 별칭으로 맞춰 보므로 서버 IP가 바뀌어도 DEPLOY_HOST만 고치면 된다.
          # (키 종류와 키 본문만 뽑는다: "ssh-ed25519 AAAA..." 앞뒤에 주소나 설명이 붙어 있어도 된다)
          printf '%s\n' "$DEPLOY_HOST_KEY" \
            | sed -nE 's/^.*((ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+) [A-Za-z0-9+\/=]+).*$/paper-trading-server \1/p' \
            > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "::error::DEPLOY_HOST_KEY에서 호스트 키를 읽지 못했습니다 (docs/DEPLOY.md)"; exit 1; }
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            HostKeyAlias paper-trading-server
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      - name: 배포 파일 올리기
        run: |
          ssh deploy-target "mkdir -p '$DEPLOY_DIR'"
          scp deploy/docker-compose.yml deploy/remote_deploy.sh "deploy-target:$DEPLOY_DIR/"

      - name: 서버에서 이미지 받아 띄우기
        id: up
        shell: bash
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 이 작업이 끝나면 못 쓰게 되는 토큰 (읽기 전용)
        run: |
          set -o pipefail
          printf '%s' "$REGISTRY_TOKEN" | ssh deploy-target "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          status=0
          ssh deploy-target "cd '$DEPLOY_DIR' && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' bash remote_deploy.sh" 2>&1 \
            | tee "$RUNNER_TEMP/deploy.out" || status=$?
          # remote_deploy.sh의 마지막 결과 줄: DEPLOY_RESULT=<success|rolled_back|rollback_failed|failed> PREVIOUS=<태그|->
          line="$(grep -E '^DEPLOY_RESULT=' "$RUNNER_TEMP/deploy.out" | tail -1 || true)"
          result="$(printf '%s' "$line" | sed -nE 's/^DEPLOY_RESULT=([a-z_]+).*/\1/p')"
          previous="$(printf '%s' "$line" | sed -nE 's/.* PREVIOUS=([0-9A-Za-z._-]+)$/\1/p')"
          [ "$previous" = "-" ] && previous=""
          echo "result=${result:-failed}" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: 서버의 레지스트리 로그인 지우기
        if: always()
        run: ssh deploy-target "docker logout ghcr.io" || true

      - name: SSH 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key

  record:
    name: 관리 서버에 배포 기록
    needs: [ci, publish, deploy]
    # 관리 서버를 준비했을 때만. 배포가 꺼져 있거나 main이 아니면(publish 건너뜀) 남길 배포가 없다
    if: always() && vars.ADMIN_RECORD_HOST != '' && vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true   # 관리 서버가 응답하지 않아도 배포 실행 결과는 바꾸지 않는다
    steps:
      - name: 결과 한 줄 보내기
        env:
          ADMIN_RECORD_HOST: ${{ vars.ADMIN_RECORD_HOST }}
          ADMIN_RECORD_USER: ${{ vars.ADMIN_RECORD_USER }}
          ADMIN_RECORD_HOST_KEY: ${{ vars.ADMIN_RECORD_HOST_KEY }}
          ADMIN_RECORD_SSH_KEY: ${{ secrets.ADMIN_RECORD_SSH_KEY }}
          SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          CI_RESULT: ${{ needs.ci.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REMOTE_RESULT: ${{ needs.deploy.outputs.result }}
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # admin/API.md 5-2: success · rolled_back · rollback_failed · failed · blocked(검사 실패로 배포하지 않음). 취소는 남기지 않는다
          if [ "$CI_RESULT" = cancelled ] || [ "$DEPLOY_RESULT" = cancelled ]; then echo "취소됨: 남기지 않음"; exit 0; fi
          if [ "$CI_RESULT" != success ]; then result=blocked
          elif [ "$DEPLOY_RESULT" = success ]; then result=success
          elif [ "$DEPLOY_RESULT" = skipped ]; then result=failed   # 이미지 올리기 실패
          else result="${REMOTE_RESULT:-failed}"
          fi
          [ -n "$ADMIN_RECORD_SSH_KEY" ] && [ -n "$ADMIN_RECORD_HOST_KEY" ] || { echo "::warning::관리 서버 기록 키가 비어 있어 건너뜁니다"; exit 0; }
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/record_key' EXIT
          printf '%s\n' "$ADMIN_RECORD_SSH_KEY" > ~/.ssh/record_key && chmod 600 ~/.ssh/record_key
          printf '%s\n' "$ADMIN_RECORD_HOST_KEY" \
            | sed -nE 's/^.*((ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+) [A-Za-z0-9+\/=]+).*$/paper-admin-server \1/p' > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "::error::ADMIN_RECORD_HOST_KEY에서 호스트 키를 읽지 못했습니다"; exit 1; }
          jq -cn --arg at "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" --arg server "${SERVER_NAME:-app}" --arg tag "$GITHUB_SHA" \
            --arg previous "$PREVIOUS" --arg result "$result" --arg actor "$ACTOR" \
            --arg commit "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)" --arg runUrl "$RUN_URL" \
            '{at: $at, server: $server, tag: $tag, previous: (if $previous == "" then null else $previous end),
              result: $result, actor: $actor, commit: ($commit | .[:120]), runUrl: $runUrl}' > "$RUNNER_TEMP/record.json"
          cat "$RUNNER_TEMP/record.json"
          # 관리 서버의 authorized_keys가 이 키에 강제 명령(deploy_record.py)을 걸어 두었다: 표준 입력의 한 줄만 검사해 더한다
          ssh -T -i ~/.ssh/record_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o HostKeyAlias=paper-admin-server -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${ADMIN_RECORD_USER:-ubuntu}@$ADMIN_RECORD_HOST" < "$RUNNER_TEMP/record.json"
