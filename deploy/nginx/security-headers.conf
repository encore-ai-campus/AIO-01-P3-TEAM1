# nginx가 직접 내주는 응답(화면·빌드 파일·관리자 정적 파일)에 붙이는 헤더. default.conf의 해당 location마다 include한다.
# nginx는 location 안에 add_header가 하나라도 있으면 server의 add_header를 물려받지 않는다. 그래서 X-Robots-Tag도 여기서 다시 적는다.
# /api, /admin은 Django가 X-Frame-Options·X-Content-Type-Options·Referrer-Policy를 붙이므로 여기를 include하지 않는다
# (같은 헤더가 두 번 나가면 브라우저가 X-Frame-Options를 무시한다).
# CSP는 아직 없다: index.html의 인라인 script·style에 hash를 넣는 작업이 먼저다 (docs/records/운영E2E점검_UX리뷰_2026-10-08.md OPS-4).
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
