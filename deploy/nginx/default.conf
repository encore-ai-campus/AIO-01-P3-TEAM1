# 브라우저 → nginx(8080) → React 빌드 파일 / Django(web:8000)
# Host는 브라우저가 보낸 그대로 넘긴다 (포트 포함). 바뀌면 Django의 CSRF 출처 검사에 걸려 로그인부터 403이 난다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    server_tokens off;
    # 검색엔진 색인 막기 (docs/DECISIONS.md 14-7 U12. index.html의 robots meta·robots.txt와 같이).
    # 아래 location에 add_header가 있으면 이 줄이 내려가지 않으므로, 직접 내주는 location은 security-headers.conf를 include한다
    # (X-Robots-Tag 포함. 이 줄은 add_header가 없는 /api·/admin·SSE 프록시 응답에 붙는다)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 압축 (OPS-3). text/html은 기본으로 압축된다. SSE(text/event-stream)는 목록에 없어 압축하지 않는다.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # nginx 자체 상태 확인 (web을 거치지 않는다)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # AI 리포트 실행 Event (SSE): 모아 두지 않고 바로 넘긴다. 서버가 60초마다 닫고 브라우저가 다시 붙는다.
    location ~ ^/api/reports/[0-9]+/events$ {
        proxy_pass http://web:8000;
        # 이 블록에 proxy_set_header를 쓰면 위(server)의 것이 내려오지 않으므로 다시 적는다
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_read_timeout 60s;
    }

    # Django가 붙이는 X-Frame-Options 등과 겹치지 않게 Django가 안 붙이는 Permissions-Policy만 더한다
    location /admin/ {
        proxy_pass http://web:8000;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Django 관리자 화면의 정적 파일 (web이 collectstatic으로 채운 볼륨)
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        include /etc/nginx/security-headers.conf;
    }

    # 빌드 파일 이름에 해시가 들어 있어 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # 화면 경로(/reports/3 등)는 모두 index.html로
    location / {
        try_files $uri /index.html;
        include /etc/nginx/security-headers.conf;
    }
}
