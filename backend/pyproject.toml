# 웹 백엔드. 외부 의존성(Django 등)은 여기에서만 추가한다. 엔진(paper-engine)은 표준 라이브러리만 쓴다.
[project]
name = "paper-backend"
version = "0.1.0"
description = "모의매매 웹 백엔드: Django + DRF"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework",
    "drf-spectacular",
    "psycopg[binary]",
    "gunicorn",
    "pyyaml",
    "paper-engine",
]

[tool.uv.sources]
paper-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "accounts", "trading", "analysis", "reports", "autotrade", "notifications", "longterm"]
