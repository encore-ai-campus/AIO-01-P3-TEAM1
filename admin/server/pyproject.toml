# 관리 서버의 관리자 백엔드(FastAPI)와 MCP 서버. 저장소 루트 uv 작업 공간과 따로 둔다 (자기 uv.lock).
#   uv sync && uv run ruff check . && uv run pytest -q
#   uv run uvicorn paper_admin.api:app --host 0.0.0.0 --port 8100
#   uv run python -m paper_admin.mcp_server
[project]
name = "paper-admin"
version = "0.1.0"
description = "모매매 관리 서버: 관리자 API(/api/admin/*)와 조회 전용 MCP 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "mcp>=2.3,<3", # mcp.server.mcpserver.MCPServer (2.x)
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: ADMIN_TEST_PG_DSN이 있을 때만 도는 PostgreSQL 통합 테스트"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
