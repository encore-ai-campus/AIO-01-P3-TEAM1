# 관리 서버 검사: 관리자 백엔드·MCP(server), 관리자 프론트(web), 실제 서비스 스키마에서 읽기 전용 확인(schema).
# push·PR마다 돌고, deploy.yml이 배포 전에 같은 검사를 부른다 (workflow_call).
# schema 작업은 서비스 저장소(비공개 SHS5029/paper_trading)의 마이그레이션을 쓴다 — 읽기 전용 deploy key를 비밀 값 SERVICE_REPO_KEY에 넣는다.
name: CI

on:
  push:
    branches-ignore: [main]   # main은 deploy.yml이 이 검사를 부른다
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SERVICE_REPO_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 관리자 백엔드·MCP (린트·테스트)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # 이 액션은 v8부터 major 태그를 내지 않는다. 정확한 버전을 적는다
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: 의존성 설치
        run: uv sync --frozen
      - name: 린트
        run: uv run ruff check .
      - name: 테스트 (SQLite)
        run: uv run pytest -q

  web:
    name: 관리자 프론트 (린트·타입·테스트·빌드)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 린트
        run: npx eslint .
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 테스트
        run: npx vitest run
      - name: 빌드
        run: npx vite build

  schema:
    name: 서비스 스키마에서 읽기 전용 확인 (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paper
          POSTGRES_USER: paper
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paper -d paper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: ci-only
      SERVICE_REPO_KEY: ${{ secrets.SERVICE_REPO_KEY }}
    steps:
      - name: 서비스 저장소 키 확인
        id: key
        run: |
          if [ -z "$SERVICE_REPO_KEY" ]; then
            echo "::warning::SERVICE_REPO_KEY가 없어 서비스 스키마 확인을 건너뜁니다 (README 4장)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
      - name: 서비스 저장소 받기 (main, 마이그레이션만 쓴다)
        if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: SHS5029/paper_trading
          ssh-key: ${{ secrets.SERVICE_REPO_KEY }}
          path: service
      - name: 복구 셈법 기준 사례가 서비스 사본과 같은지 (API.md 3장)
        if: steps.key.outputs.ok == 'true'
        run: |
          cmp recovery_cases.json service/backend/reports/tests/recovery_cases.json \
            || { echo "::error::recovery_cases.json이 서비스 저장소 사본과 다릅니다. 두 저장소를 같이 고친다"; exit 1; }
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            service/uv.lock
            server/uv.lock
      - name: 서비스 마이그레이션 (서비스 코드 그대로)
        if: steps.key.outputs.ok == 'true'
        working-directory: service
        env:
          DJANGO_DEBUG: "on"
          DJANGO_SECRET_KEY: ci-only-not-a-secret
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: paper
          POSTGRES_USER: paper
          POSTGRES_PASSWORD: ci-only
        run: |
          uv sync --frozen
          uv run python backend/manage.py migrate --noinput
      - name: 읽기 전용 계정 만들기 (두 번 돌려도 된다)
        if: steps.key.outputs.ok == 'true'
        run: |
          for i in 1 2; do
            psql -h 127.0.0.1 -U paper -d paper -v ON_ERROR_STOP=1 -v ro_password=ro-ci-only -q -f deploy/readonly_role.sql
          done
      - name: 관리자 백엔드를 읽기 전용 계정으로 (모든 경로 200, 쓰기 실패)
        if: steps.key.outputs.ok == 'true'
        working-directory: server
        env:
          ADMIN_TEST_PG_DSN: postgresql://paper_admin_ro:ro-ci-only@127.0.0.1:5432/paper
        run: |
          uv sync --frozen
          uv run pytest -q -m pg -rs
