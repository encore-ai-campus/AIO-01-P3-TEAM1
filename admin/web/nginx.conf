# 관리자 프론트(정적 파일) + 관리자 백엔드·MCP로 넘기는 nginx. nginx-unprivileged라 8080에서 듣는다.
# 관리 서버의 compose 서비스 이름: api(관리자 백엔드, 8100) · mcp(MCP 서버, 8101).

# 로그인은 IP마다 분당 10번까지 (퍼블릭 IP로 열었으므로 — README 9장). 관리자 백엔드는 따로 아이디마다 10분에 5번으로 막는다
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더 (location 안에서 add_header를 다시 쓰면 이 값이 사라지므로 여기서만 쓴다)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # compose의 Docker DNS로 이름을 풀어, api·mcp가 아직 안 떠 있어도 nginx는 시작한다
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location = /api/admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        set $admin_api http://api:8100;
        proxy_pass $admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        set $admin_api http://api:8100;
        proxy_pass $admin_api;
        proxy_http_version 1.1;
        # 백엔드 상한(쿼리 5초 × 개요 쿼리 수, 연결 대기 10초)보다 길게: nginx가 먼저 504 HTML을 내지 않게
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP는 스트리밍(SSE)이므로 버퍼링을 끈다
    location /mcp {
        set $admin_mcp http://mcp:8101;
        proxy_pass $admin_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 해시 이름이 붙은 정적 파일은 오래 캐시한다
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA: 모르는 경로는 index.html로
    location / {
        try_files $uri /index.html;
    }
}
