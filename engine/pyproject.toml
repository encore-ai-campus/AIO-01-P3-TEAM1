# 매매 엔진. 런타임은 표준 라이브러리만 쓴다 (의존성을 추가하지 않는다. Django 등은 backend/에서만).
[project]
name = "paper-engine"
version = "0.1.0"
description = "모의매매 엔진: 선별, AI 교차검증, 리스크 엔진, 모의 체결, 기록"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_engine"]
